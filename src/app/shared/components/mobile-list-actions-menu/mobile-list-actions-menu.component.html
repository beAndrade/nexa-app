<div
  class="mobile-list-actions-menu"
  [class.mobile-list-actions-menu--open]="open"
  [attr.data-anchor]="anchor"
  role="menu"
  [attr.aria-hidden]="open ? null : 'true'"
  [attr.inert]="open ? null : ''"
>
  @for (item of items; track item.id) {
    <button
      type="button"
      class="mobile-list-actions-menu__item"
      [class.mobile-list-actions-menu__item--danger]="item.danger"
      role="menuitem"
      [disabled]="!!item.disabled"
      [attr.aria-label]="item.ariaLabel || null"
      (click)="selectItem(item)"
    >
      @if (item.icon === 'trash') {
        <svg
          class="mobile-list-actions-menu__icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
          <path d="M3 6h18" />
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </svg>
      }
      {{ item.label }}
    </button>
  }
</div>
