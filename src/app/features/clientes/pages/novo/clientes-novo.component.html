<div class="toolbar">
  <div class="toolbar__head">
    <a
      routerLink="/clientes"
      class="btn-back-hero"
      aria-label="Voltar à lista"
      title="Voltar à lista"
      (click)="onVoltar($event)"
    >
      <svg
        class="btn-back-hero__svg"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
    </a>
    <h1>Novo cliente</h1>
  </div>
</div>

<div class="clientes-pagina-form">
  <app-cliente-cadastro-form [mostrarRodape]="true" />
</div>
